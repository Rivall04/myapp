services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myappuser
      POSTGRES_PASSWORD: password
      POSTGRES_DB: myappdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myappuser -d myappdb"]
      interval: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: myappuser
      DB_PASS: password
      DB_NAME: myappdb
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      ENV: production
    depends_on:
      - backend

volumes:
  pgdata:
